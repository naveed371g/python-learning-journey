<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bay Area Job Agent</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #21253a;
      --border: #2e3250;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --text: #e8eaf6;
      --muted: #8b90b0;
      --indeed: #2164f3;
      --linkedin: #0a66c2;
      --card-bg: #181b2e;
      --card-hover: #1e2236;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .header-meta {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .badge-free {
      background: rgba(0, 212, 170, 0.15);
      color: var(--accent2);
    }

    .badge-bay {
      background: rgba(108, 99, 255, 0.15);
      color: var(--accent);
    }

    /* ── Main layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Chat panel ── */
    .chat-panel {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .msg {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-agent .msg-avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .msg-user .msg-avatar {
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .msg-user {
      flex-direction: row-reverse;
    }

    .msg-user .msg-bubble {
      background: linear-gradient(135deg, #3730a3, #312e81);
      border-radius: var(--radius) 4px var(--radius) var(--radius);
      margin-left: 40px;
    }

    .msg-agent .msg-bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px var(--radius) var(--radius) var(--radius);
      margin-right: 40px;
    }

    .msg-bubble {
      padding: 10px 14px;
      font-size: 0.88rem;
      line-height: 1.55;
      max-width: 100%;
    }

    .msg-bubble strong {
      font-weight: 600;
    }

    .msg-bubble em {
      color: var(--accent2);
      font-style: normal;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 14px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(0.7);
        opacity: 0.5;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .chat-input-area {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      background: var(--surface);
    }

    #user-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.88rem;
      padding: 10px 14px;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    #user-input:focus {
      border-color: var(--accent);
    }

    #user-input::placeholder {
      color: var(--muted);
    }

    #send-btn {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1.1rem;
      width: 42px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #send-btn:hover {
      opacity: 0.88;
    }

    #send-btn:active {
      transform: scale(0.95);
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0 12px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    #clear-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* ── Jobs panel ── */
    .jobs-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .jobs-header {
      padding: 16px 24px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .jobs-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .jobs-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 0.76rem;
      padding: 4px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(108, 99, 255, 0.1);
    }

    .jobs-grid {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
      align-content: start;
    }

    .jobs-grid::-webkit-scrollbar {
      width: 5px;
    }

    .jobs-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .jobs-grid::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ── Empty / loading state ── */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon {
      font-size: 3rem;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 320px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Job card ── */
    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.18s, border-color 0.18s, background 0.18s;
      cursor: pointer;
      animation: fadeIn 0.3s ease;
      position: relative;
    }

    .job-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-source {
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .source-indeed {
      background: rgba(33, 100, 243, 0.18);
      color: #6b9eff;
    }

    .source-linkedin {
      background: rgba(10, 102, 194, 0.18);
      color: #5ba8e5;
    }

    .card-score {
      font-size: 0.7rem;
      color: var(--accent2);
      font-weight: 600;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .card-company {
      font-size: 0.83rem;
      color: var(--accent2);
      font-weight: 500;
    }

    .card-location {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-salary {
      font-size: 0.8rem;
      font-weight: 600;
      color: #a8edbd;
      background: rgba(168, 237, 189, 0.1);
      padding: 3px 9px;
      border-radius: 6px;
      width: fit-content;
    }

    .card-snippet {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .card-date {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .card-link {
      background: rgba(108, 99, 255, 0.15);
      border: 1px solid rgba(108, 99, 255, 0.3);
      border-radius: 7px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .card-link:hover {
      background: rgba(108, 99, 255, 0.3);
      border-color: var(--accent);
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 20px;
      padding: 8px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .stat strong {
      color: var(--text);
    }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .chat-panel {
        width: 100%;
        border-right: none;
      }

      .jobs-panel {
        display: none;
      }

      .main {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-icon">🌉</div>
      Bay Area Job Agent
    </div>
    <div class="header-meta">
      <span class="badge badge-bay">📍 SF Bay Area</span>
      <span class="badge badge-free">✦ No API Key</span>
      <span>Indeed + LinkedIn</span>
    </div>
  </header>

  <div class="main">
    <!-- Chat -->
    <div class="chat-panel">
      <div class="chat-messages" id="chat-messages">
        <div class="msg msg-agent">
          <div class="msg-avatar">🤖</div>
          <div class="msg-bubble" id="welcome-bubble"></div>
        </div>
      </div>
      <div class="chat-input-area">
        <textarea id="user-input" placeholder="Describe your target role…" rows="1"></textarea>
        <button id="clear-btn" title="Start over">↺</button>
        <button id="send-btn" title="Send">➤</button>
      </div>
    </div>

    <!-- Jobs -->
    <div class="jobs-panel">
      <div class="jobs-header">
        <div class="jobs-title" id="jobs-title">Job Results</div>
        <div class="jobs-meta" id="jobs-meta">Chat to start your search</div>
      </div>

      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Indeed">Indeed</button>
        <button class="filter-btn" data-filter="LinkedIn">LinkedIn</button>
        <button class="filter-btn" data-filter="remote">Remote</button>
        <button class="filter-btn" data-filter="salary">Has Salary</button>
      </div>

      <div class="jobs-grid" id="jobs-grid">
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <p>Tell the agent your target role and skills.<br>It will search Indeed + LinkedIn for Bay Area jobs.</p>
        </div>
      </div>

      <div class="stats-bar" id="stats-bar" style="display:none">
        <span>Total: <strong id="stat-total">0</strong></span>
        <span>Indeed: <strong id="stat-indeed">0</strong></span>
        <span>LinkedIn: <strong id="stat-linkedin">0</strong></span>
        <span>With Salary: <strong id="stat-salary">0</strong></span>
      </div>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');
    const gridEl = document.getElementById('jobs-grid');
    const titleEl = document.getElementById('jobs-title');
    const metaEl = document.getElementById('jobs-meta');
    const statsBar = document.getElementById('stats-bar');

    let allJobs = [];
    let activeFilter = 'all';

    // ── Render welcome markdown ──
    const welcome = `{{ welcome | safe }}`;
    document.getElementById('welcome-bubble').innerHTML = markdownToHtml(welcome);

    // ── Simple markdown parser ──
    function markdownToHtml(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
    }

    // ── Add message bubble ──
    function addMessage(role, text, typing = false) {
      const wrap = document.createElement('div');
      wrap.className = `msg msg-${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'agent' ? '🤖' : '👤';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      if (typing) {
        bubble.innerHTML = `<div class="typing-indicator">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>`;
      } else {
        bubble.innerHTML = markdownToHtml(text);
      }
      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    // ── Render job cards ──
    function renderJobs(jobs) {
      allJobs = jobs;
      applyFilter(activeFilter);
      updateStats(jobs);
    }

    function applyFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filter);
      });

      let filtered = allJobs;
      if (filter === 'Indeed') filtered = allJobs.filter(j => j.source === 'Indeed');
      if (filter === 'LinkedIn') filtered = allJobs.filter(j => j.source === 'LinkedIn');
      if (filter === 'remote') filtered = allJobs.filter(j =>
        /remote|wfh|work from home/i.test(j.title + j.snippet + j.location));
      if (filter === 'salary') filtered = allJobs.filter(j => j.salary);

      gridEl.innerHTML = '';

      if (!filtered.length) {
        gridEl.innerHTML = `<div class="empty-state">
        <div class="empty-icon">😕</div>
        <p>No jobs match this filter. Try a different one.</p>
      </div>`;
        return;
      }

      filtered.forEach((job, i) => {
        const card = document.createElement('div');
        card.className = 'job-card';
        const srcClass = job.source === 'LinkedIn' ? 'source-linkedin' : 'source-indeed';
        card.innerHTML = `
        <div class="card-top">
          <span class="card-source ${srcClass}">${job.source}</span>
          ${job.score > 0 ? `<span class="card-score">★ ${job.score}</span>` : ''}
        </div>
        <div class="card-title">${escHtml(job.title)}</div>
        <div class="card-company">${escHtml(job.company)}</div>
        <div class="card-location">📍 ${escHtml(job.location)}</div>
        ${job.salary ? `<div class="card-salary">💰 ${escHtml(job.salary)}</div>` : ''}
        ${job.snippet ? `<div class="card-snippet">${escHtml(job.snippet)}</div>` : ''}
        <div class="card-footer">
          <span class="card-date">${escHtml(job.date_posted || '')}</span>
          <a class="card-link" href="${escHtml(job.url)}" target="_blank" rel="noopener"
             onclick="event.stopPropagation()">View Job →</a>
        </div>
      `;
        gridEl.appendChild(card);
      });
    }

    function updateStats(jobs) {
      const total = jobs.length;
      const indeed = jobs.filter(j => j.source === 'Indeed').length;
      const linkedin = jobs.filter(j => j.source === 'LinkedIn').length;
      const salary = jobs.filter(j => j.salary).length;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-indeed').textContent = indeed;
      document.getElementById('stat-linkedin').textContent = linkedin;
      document.getElementById('stat-salary').textContent = salary;
      statsBar.style.display = total ? 'flex' : 'none';
      titleEl.textContent = total ? `${total} Jobs Found` : 'Job Results';
      metaEl.textContent = total ? `Ranked by relevance • Bay Area` : 'Chat to start your search';
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Send message ──
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      addMessage('user', text);
      const thinkingBubble = addMessage('agent', '', true);

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        thinkingBubble.innerHTML = markdownToHtml(data.reply);

        if (data.searching && data.query) {
          gridEl.innerHTML = `<div class="empty-state">
          <div class="spinner"></div>
          <p>Scraping Indeed + LinkedIn for <strong>${escHtml(data.query)}</strong>…<br>
          This takes 20–40 seconds.</p>
        </div>`;
          titleEl.textContent = 'Searching…';
          metaEl.textContent = data.query;

          const searchRes = await fetch('/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: data.query, source_filter: data.source_filter || 'both' }),
          });
          const searchData = await searchRes.json();
          addMessage('agent', searchData.reply);
          renderJobs(searchData.jobs || []);
        }
      } catch (err) {
        thinkingBubble.innerHTML = `⚠️ Something went wrong: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // ── Filter buttons ──
    document.getElementById('filter-bar').addEventListener('click', e => {
      if (e.target.classList.contains('filter-btn')) {
        applyFilter(e.target.dataset.filter);
      }
    });

    // ── Clear / reset ──
    clearBtn.addEventListener('click', async () => {
      await fetch('/clear', { method: 'POST' });
      location.reload();
    });

    // ── Input auto-resize + Enter key ──
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    inputEl.focus();
  </script>
</body>

</html>
